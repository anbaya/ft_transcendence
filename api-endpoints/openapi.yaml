openapi: 3.0.3

info:
  title: ft_transcendence
  version: 1.0.0
  description: Common API endpoints for all Django services.

servers:
  - url: /api

paths:

  # ==========================================
  # AUTH SERVICE
  # ==========================================

  /auth/register/:
    post:
      summary: Register a user
      responses:
        '201':
          description: User created

  /auth/login/:
    post:
      summary: Login
      responses:
        '200':
          description: Login successful

  /auth/logout/:
    post:
      summary: Logout
      responses:
        '200':
          description: Logout successful

  /auth/me/:
    get:
      summary: Get current user
      responses:
        '200':
          description: Current user

  # ==========================================
  # USERS
  # ==========================================

  /users/:
    get:
      summary: Get users
      responses:
        '200':
          description: Users retrieved

  /users/{id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get user
      responses:
        '200':
          description: User retrieved

    patch:
      summary: Update user information
      responses:
        '200':
          description: User updated

    delete:
      summary: Delete user
      responses:
        '204':
          description: User deleted

  /users/{id}/role/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    patch:
      summary: Update user role
      responses:
        '200':
          description: Role updated

  # ==========================================
  # ORGANIZATIONS
  # ==========================================

  /organizations/:
    get:
      summary: Get organizations
      responses:
        '200':
          description: Organizations retrieved

    post:
      summary: Create organization
      responses:
        '201':
          description: Organization created

  /organizations/{id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get organization
      responses:
        '200':
          description: Organization retrieved

    patch:
      summary: Update organization
      responses:
        '200':
          description: Organization updated

    delete:
      summary: Delete organization
      responses:
        '204':
          description: Organization deleted

  /organizations/{id}/members/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get organization members
      responses:
        '200':
          description: Members retrieved

    post:
      summary: Add organization member
      responses:
        '201':
          description: Member added

  /organizations/{id}/members/{user_id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: user_id
        in: path
        required: true
        schema:
          type: integer

    delete:
      summary: Remove organization member
      responses:
        '204':
          description: Member removed

  # ==========================================
  # PROJECT SERVICE
  # ==========================================

  /projects/:
    get:
      summary: Get projects
      responses:
        '200':
          description: Projects retrieved

    post:
      summary: Create project
      responses:
        '201':
          description: Project created

  /projects/{id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get project
      responses:
        '200':
          description: Project retrieved

    patch:
      summary: Update project
      responses:
        '200':
          description: Project updated

    delete:
      summary: Delete project
      responses:
        '204':
          description: Project deleted

  /projects/{id}/members/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get project members
      responses:
        '200':
          description: Members retrieved

    post:
      summary: Add project member
      responses:
        '201':
          description: Member added

  /projects/{id}/members/{user_id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: user_id
        in: path
        required: true
        schema:
          type: integer

    delete:
      summary: Remove project member
      responses:
        '204':
          description: Member removed

  # ==========================================
  # TASK SERVICE
  # ==========================================

  /projects/{project_id}/tasks/:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get project tasks
      responses:
        '200':
          description: Tasks retrieved

    post:
      summary: Create task
      responses:
        '201':
          description: Task created

  /tasks/{id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get task
      responses:
        '200':
          description: Task retrieved

    patch:
      summary: Update task
      responses:
        '200':
          description: Task updated

    delete:
      summary: Delete task
      responses:
        '204':
          description: Task deleted

  /tasks/{id}/status/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    patch:
      summary: Update task status
      responses:
        '200':
          description: Status updated

  /tasks/{id}/assignee/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    patch:
      summary: Assign task to member
      responses:
        '200':
          description: Assignee updated

  /users/me/tasks/:
    get:
      summary: Get my assigned tasks
      responses:
        '200':
          description: Tasks retrieved

  # ==========================================
  # CHAT SERVICE
  # ==========================================

  /conversations/:
    get:
      summary: Get conversations
      responses:
        '200':
          description: Conversations retrieved

    post:
      summary: Create conversation
      responses:
        '201':
          description: Conversation created

  /conversations/{id}/messages/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get conversation messages
      responses:
        '200':
          description: Messages retrieved

    post:
      summary: Send message
      responses:
        '201':
          description: Message sent

  /messages/{id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    patch:
      summary: Edit message
      responses:
        '200':
          description: Message updated

    delete:
      summary: Delete message
      responses:
        '204':
          description: Message deleted

  # ==========================================
  # NOTIFICATIONS
  # ==========================================

  /notifications/:
    get:
      summary: Get my notifications
      responses:
        '200':
          description: Notifications retrieved

  /notifications/{id}/read/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    patch:
      summary: Mark notification as read
      responses:
        '200':
          description: Notification updated

  # ==========================================
  # DOCUMENT SERVICE
  # ==========================================

  /projects/{project_id}/documents/:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get project documents
      responses:
        '200':
          description: Documents retrieved

    post:
      summary: Upload document
      responses:
        '201':
          description: Document uploaded

  /documents/{id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get document information
      responses:
        '200':
          description: Document retrieved

    delete:
      summary: Delete document
      responses:
        '204':
          description: Document deleted

  /documents/{id}/download/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Download document
      responses:
        '200':
          description: Document downloaded

  # ==========================================
  # AI SERVICE
  # ==========================================

  /ai/chat/:
    post:
      summary: Chat with AI assistant
      responses:
        '200':
          description: AI response generated

  /ai/generate/:
    post:
      summary: Generate AI content
      responses:
        '200':
          description: Content generated

  /ai/rag/query/:
    post:
      summary: Ask questions about project documents
      responses:
        '200':
          description: Answer generated

  /ai/interactions/:
    get:
      summary: Get my AI interactions
      responses:
        '200':
          description: Interactions retrieved

  # ==========================================
  # ANALYTICS
  # ==========================================

  /projects/{id}/analytics/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get project analytics
      responses:
        '200':
          description: Analytics retrieved

  /users/me/activity/:
    get:
      summary: Get my activity
      responses:
        '200':
          description: Activity retrieved