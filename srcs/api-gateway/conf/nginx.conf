events {
	worker_connections 1024;
}

http {
	include       mime.types;
	default_type  application/octet-stream;

	# Internal Docker resolver (required to resolve service names)
	resolver 127.0.0.11 valid=10s;

	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name localhost;

		# Self-signed SSL certs (we will generate these in the Dockerfile)
		ssl_certificate /etc/nginx/ssl/transcendence.crt;
		ssl_certificate_key /etc/nginx/ssl/transcendence.key;
		ssl_protocols TLSv1.2 TLSv1.3;

		# Frontend Routing
		location / {
			set $frontend_upstream frontend:3000;
			proxy_pass http://$frontend_upstream;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
		}

		# Auth Service API
		location /api/auth/ {
			set $auth_upstream auth-service:3000;
			proxy_pass http://$auth_upstream/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
		}

		# Project Service API
		location /api/projects/ {
			set $project_upstream project-service:3000;
			proxy_pass http://$project_upstream/;
		}

		# Task Service API
		location /api/tasks/ {
			set $task_upstream task-service:3000;
			proxy_pass http://$task_upstream/;
		}

		# Document Service API
		location /api/documents/ {
			set $document_upstream document-service:3000;
			proxy_pass http://$document_upstream/;
			# Increase body size for file uploads
			client_max_body_size 50M;
		}

		# AI Service API
		location /api/ai/ {
			set $ai_upstream ai-service:3000;
			proxy_pass http://$ai_upstream/;
		}

		# Chat & Notifications (WebSocket Support)
		location /ws/ {
			set $chat_upstream chat-service:3000;
			proxy_pass http://$chat_upstream/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		}
	}
}
