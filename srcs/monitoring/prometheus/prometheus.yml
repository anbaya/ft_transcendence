global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: backend-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:8000
          - project-service:8000
          - task-service:8000
          - chat-service:8000
          - document-service:8000
          - ai-service:8000
