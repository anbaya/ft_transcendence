<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset your password</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, sans-serif;">

    <div style="max-width:600px; margin:40px auto; background-color:#ffffff;
                padding:40px; border-radius:10px; text-align:center;">

        <h2 style="margin-bottom:10px;">
            ft_transcendence
        </h2>

        <h1 style="font-size:24px; margin-bottom:20px;">
            Reset your password
        </h1>

        <p style="font-size:16px; line-height:1.6;">
            We received a request to reset your password.
        </p>

        <p style="font-size:16px; line-height:1.6;">
            Click the button below to choose a new password.
        </p>

        <div style="margin:30px 0;">
            <a href="{{ reset_url }}"
               style="
                   display:inline-block;
                   padding:14px 28px;
                   background-color:#111827;
                   color:#ffffff;
                   text-decoration:none;
                   border-radius:6px;
                   font-size:16px;
                   font-weight:bold;
               ">
                Reset Password
            </a>
        </div>

        <p style="font-size:14px; color:#666666; line-height:1.5;">
            If you didn't request a password reset,
            you can safely ignore this email.
        </p>

        <hr style="border:none; border-top:1px solid #eeeeee; margin:30px 0;">

        <p style="font-size:12px; color:#999999;">
            ft_transcendence
        </p>

    </div>

</body>
</html>
